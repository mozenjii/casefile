# Runs the same gates as `uv run python scripts/check.py --browser --audit` locally: format, lint,
# no suppressed checks or skipped tests, public doc links, no possibly real personal identifiers,
# strict types, tests with an 80% coverage floor (including the crash matrix and the approval
# property tests), the review screen driven in headless Chromium, and known advisories against the
# locked dependencies.
#
# Not gated yet:
#   - automated accessibility and page-performance checks on the review screen
#   - Windows; CI runs Linux only, local development happens on Windows

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Install the browser for the review-screen tests
        run: uv run playwright install --with-deps chromium
      - name: Run every gate
        run: uv run python scripts/check.py --browser --audit
