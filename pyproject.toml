[project]
name = "casefile"
version = "0.0.0"
description = "A durable, human-in-the-loop workflow for reviewing synthetic prior-authorization cases."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.120",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # likely bugs
    "UP",       # modern syntax for the pinned interpreter
    "SIM",      # needless complexity
    "RUF",      # ruff's own rules, including unused suppressions
    "D",        # docstrings: every module and public symbol says what it is for
    "PT",       # pytest idioms
    "S",        # common security mistakes
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are not an API; their names say what they check. Modules still need a docstring.
# Bare asserts are how pytest checks things.
"tests/**" = ["D103", "S101"]
# The check runner shells out to the tools it runs, with fixed argument lists.
"scripts/**" = ["S603", "S607"]
# The crash matrix starts the current interpreter with fixed code and paths it created itself.
"src/casefile/crash_matrix.py" = ["S603"]
# The generator draws synthetic cases from a seeded generator on purpose: reproducible, not secret.
"src/casefile/generator.py" = ["S311"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/casefile"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
